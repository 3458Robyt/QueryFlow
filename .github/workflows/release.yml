name: QueryFlow release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv run python -m unittest test_queryflow.py tests
      - run: python3 scripts/validate_plugin.py plugins/queryflow
      - run: python3 scripts/check_release_hygiene.py
      - run: uv build
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*

name: QueryFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run python -m unittest test_queryflow.py tests
      - run: uvx --from ruff==0.8.6 ruff check queryflow tests scripts
      - run: uvx --from ruff==0.8.6 ruff format --check queryflow/errors.py scripts/check_version_consistency.py tests/test_v2_workflow.py
      - run: uvx --from mypy==1.14.1 mypy --ignore-missing-imports queryflow
      - run: uvx --from coverage==7.6.10 coverage run --source=queryflow -m unittest test_queryflow.py tests
      - run: uvx --from coverage==7.6.10 coverage report --fail-under=55
      - run: uv build
      - run: python3 scripts/validate_plugin.py plugins/queryflow
      - run: python3 scripts/check_version_consistency.py
      - run: python3 scripts/check_release_hygiene.py
